<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Ergebnis-Kontrolle: Reihenschaltung</title>
<style>
:root{--bg:#070b12;--panel:#0e1623;--panel2:#142034;--line:#1f3050;--text:#dbe7f5;--dim:#7f93ad;--cyan:#19e3ff;--cyan-d:#0a8aa0;--ok:#2dff9a;--warn:#ffb020;--bad:#ff4d6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 420px at 50% -120px,rgba(25,227,255,.13),transparent 70%),linear-gradient(rgba(25,227,255,.035) 1px,transparent 1px) 0 0/100% 28px,var(--bg);padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin:0;font-weight:600;color:var(--cyan)}
.sub{font-size:12px;color:var(--dim);letter-spacing:.04em;margin:3px 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--dim);font-size:13px;line-height:1.4}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick a{display:block;text-align:center;border:1px solid var(--cyan-d);border-radius:10px;padding:14px 6px;color:var(--cyan);text-decoration:none;font:700 13px ui-monospace,Consolas,monospace;letter-spacing:.06em;background:rgba(25,227,255,.06)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.lab{flex:1 1 100%;font-size:14px}
.lab i{font-style:italic}
.in{display:flex;align-items:center;gap:8px;flex:1 1 auto}
input,select{font:inherit;font-size:16px;color:var(--text);background:#060b14;border:1px solid var(--cyan-d);border-radius:8px;padding:9px 10px;min-width:0}
input[type=text]{width:96px;font-family:ui-monospace,Consolas,monospace}
input.sm{width:64px}
select{max-width:100%}
.in{min-width:0;max-width:100%}
.in select.wide{width:100%;text-overflow:ellipsis}
input:focus,select:focus{outline:2px solid var(--cyan);outline-offset:1px}
.st{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#2c4366}
.st.ok{border-color:var(--ok);color:#04120b;background:var(--ok);box-shadow:0 0 12px rgba(45,255,154,.5)}
.st.no{border-color:var(--warn);color:#201400;background:var(--warn)}
.fb{flex:1 1 100%;font-size:13px;color:var(--warn);line-height:1.4;display:none}
.fb.show{display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{appearance:none;border:1px solid var(--cyan);background:rgba(25,227,255,.08);color:var(--cyan);font:700 13px ui-monospace,Consolas,monospace;letter-spacing:.16em;padding:12px 22px;border-radius:10px;cursor:pointer;box-shadow:0 0 18px rgba(25,227,255,.2)}
.btn:active{background:rgba(25,227,255,.22)}
.btn.sec{border-color:var(--line);color:var(--dim);box-shadow:none;background:none;letter-spacing:.08em}
.msg{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;display:none}
.msg.show{display:block}
.msg.ok{border-color:#145a3a;background:rgba(45,255,154,.07)}
.msg.warn{border-color:#5a4210}
.muster{margin-top:12px;border:1px dashed var(--cyan-d);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;display:none;white-space:pre-line}
.muster.show{display:block}
.muster b{color:var(--cyan)}
.nav{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.nav a{color:var(--dim)}
.note{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.5;text-align:center}
.prog .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:8px}
.prog .pt b{font:700 15px ui-monospace,Consolas,monospace;color:var(--text)}
.bar{position:relative;height:10px;border-radius:6px;background:#060b14;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cyan-d)}
.bar.frei i{background:var(--ok)}
.bar u{position:absolute;top:0;bottom:0;left:80%;width:1px;background:var(--dim)}
.prog .cs{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.4}
.prog .cs.frei{color:var(--ok)}
.pick a.done{border-color:var(--ok);color:var(--ok)}
.fin{margin-top:8px;font-size:13px;color:var(--ok);display:none}
.fin.show{display:block}
.hlp{margin-top:12px}
.hlp h3{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hl{border-top:1px solid var(--line)}
.hh{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;background:none;border:0;color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.hh[disabled]{cursor:default;opacity:.45}
.hh .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%}
.hh .t{flex:1}
.hh .s{font:600 11px ui-monospace,Consolas,monospace;color:var(--dim);letter-spacing:.1em}
.hb{display:none;margin:0 0 12px 19px;padding:2px 0 2px 12px;border-left:2px solid var(--line);font-size:14px;line-height:1.5}
.hl.open .hb{display:block}
.hl.open .hh .s{color:var(--text)}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.015)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>

</div>
<script>
(function(){
  'use strict';

  var EH={Ohm:[['Ω',1],['kΩ',1000]],V:[['V',1],['mV',0.001]],A:[['A',1],['mA',0.001]],W:[['W',1],['kW',1000]],plain:[['',1]]};
  var D={"thema": "Arbeit und Leistung", "kennung": "leistung", "reihenfolge": ["1", "2", "3", "4", "5", "6", "7"], "aufgaben": {"1": {"titel": "Heizlüfter: Strom und Widerstand", "felder": [{"t": "num", "l": "Strom <i>I</i>", "e": "A", "v": 10, "falsch": [[0.1, "Du hast Spannung durch Leistung gerechnet. Der Strom ist Leistung durch Spannung."]]}, {"t": "num", "l": "Widerstand <i>R</i>", "e": "Ohm", "v": 23}], "hinweis": "Leistung = Spannung mal Strom. Der Widerstand folgt aus Spannung und Strom.", "muster": "I = 10 A; R = 23 Ω", "hilfe": ["Schreibe zuerst auf, was gegeben und was gesucht ist. Wie hängen Leistung, Spannung und Strom zusammen?", "Tabellenbuch: Elektrische Leistung. Zuerst den Strom, danach den Widerstand aus Spannung und Strom.", "Strom = Leistung durch Spannung. Widerstand = Spannung durch Strom."]}, "2": {"titel": "Heizlüfter: Arbeit und Kosten", "felder": [{"t": "num", "l": "Arbeit der Woche in kWh", "e": "plain", "v": 46, "falsch": [[46000, "Du hast die Leistung in Watt eingesetzt. Für kWh brauchst du kW."]]}, {"t": "num", "l": "Kosten der Woche in €", "e": "plain", "v": 13.8}], "hinweis": "Arbeit = Leistung (in kW) mal Zeit (in h). Dann mal Preis je kWh.", "muster": "W = 46 kWh; Kosten 13,80 €", "hilfe": ["Welche Größe wird auf der Stromrechnung abgerechnet: Leistung oder Arbeit?", "Tabellenbuch: Elektrische Arbeit. Arbeit = Leistung mal Zeit, in kWh.", "Erst die Gesamtbetriebszeit der Woche bilden, damit die Arbeit in kWh, dann mit dem Preis je kWh multiplizieren."]}, "3": {"titel": "Die fehlende Größe", "felder": [{"t": "num", "l": "Fall 1: Leistung <i>P</i>", "e": "W", "v": 920}, {"t": "num", "l": "Fall 2: Strom <i>I</i>", "e": "A", "v": 5}, {"t": "num", "l": "Fall 3: Leistung <i>P</i>", "e": "W", "v": 200, "falsch": [[100, "Der Strom geht quadratisch ein: P = I² mal R."], [400, "Du hast mit dem Strom nur einmal multipliziert, er geht quadratisch ein."]]}], "hinweis": "Fall 1 und 2: P = U mal I. Fall 3: P = I² mal R.", "muster": "Fall 1: 920 W; Fall 2: 5 A; Fall 3: 200 W"}, "4": {"titel": "Je-desto bei der Leistung", "felder": [{"t": "wahl", "l": "Strom verdoppelt", "o": ["vervierfacht sich", "sinkt auf ein Viertel", "verdoppelt sich", "halbiert sich"], "r": 0}, {"t": "wahl", "l": "Spannung halbiert", "o": ["vervierfacht sich", "sinkt auf ein Viertel", "verdoppelt sich", "halbiert sich"], "r": 1}, {"t": "wahl", "l": "Spannung verdoppelt", "o": ["vervierfacht sich", "sinkt auf ein Viertel", "verdoppelt sich", "halbiert sich"], "r": 0}, {"t": "wahl", "l": "Widerstand verdoppelt (Spannung gleich)", "o": ["vervierfacht sich", "sinkt auf ein Viertel", "verdoppelt sich", "halbiert sich"], "r": 3}], "hinweis": "Setze in P = U² durch R und P = I² mal R ein und überlege, was Verdoppeln oder Halbieren bewirkt.", "muster": "I doppelt: ×4; U halb: ¼; U doppelt: ×4; R doppelt: ½"}, "5": {"titel": "Steckdose und Sicherung", "felder": [{"t": "num", "l": "Höchstleistung des Stromkreises", "e": "W", "v": 3680}, {"t": "num", "l": "Summe der drei Geräte", "e": "W", "v": 5300}, {"t": "wahl", "l": "Dürfen alle drei gleichzeitig laufen?", "o": ["ja", "nein"], "r": 1}], "hinweis": "Die Höchstleistung folgt aus 230 V und dem Nennstrom der Sicherung. Die Geräteleistungen addieren sich.", "muster": "Höchstleistung 3 680 W; Summe 5 300 W, mehr als 3 680 W: nein.", "nur": "Die Begründung vergleichst du mit der Musterantwort:", "hilfe": ["Welche Leistung kann der Stromkreis höchstens liefern? Sie hängt von der Spannung und vom Strom ab, bei dem die Sicherung auslöst.", "Tabellenbuch: Elektrische Leistung. Die Geräteleistungen addieren sich, wenn sie gleichzeitig laufen.", "Höchstleistung aus 230 V mal 16 A berechnen, die drei Geräteleistungen addieren und vergleichen."]}, "6": {"titel": "Rechnungen prüfen", "felder": [{"t": "wahl", "l": "Zeile 1: 1,5 kW über 2 h = 0,3 kWh", "o": ["r", "f"], "r": 1}, {"t": "wahl", "l": "Zeile 2: 230 V, 5 A: P = 1 150 W", "o": ["r", "f"], "r": 0}, {"t": "wahl", "l": "Zeile 3: 2 000 W, 230 V: I = 8,7 A", "o": ["r", "f"], "r": 0}, {"t": "wahl", "l": "Zeile 4: 500 W über 90 min = 750 kWh", "o": ["r", "f"], "r": 1}], "hinweis": "Prüfe Rechenweg und Einheiten (W, kW, h, min).", "muster": "Zeile 1 falsch (3 kWh); Zeile 4 falsch (0,75 kWh)."}, "7": {"titel": "Zusatzaufgabe: LED gegen Glühlampe", "felder": [{"t": "num", "l": "Ersparnis im Jahr in €", "e": "plain", "v": 15.6, "falsch": [[18, "Das sind nur die Kosten der Glühlampe. Ziehe die Kosten der LED ab."]]}], "hinweis": "Berechne die Arbeit beider Lampen in kWh und bilde die Kosten.", "muster": "Glühlampe 18,00 €, LED 2,40 €, Ersparnis 15,60 €.", "hilfe": ["Welche Größe ist bei beiden Lampen gleich, welche unterscheidet sich? Auf welcher Größe baut die Abrechnung auf?", "Tabellenbuch: Elektrische Arbeit. Watt in Kilowatt umrechnen, dann Arbeit mal Preis.", "Arbeit beider Lampen im Jahr in kWh berechnen, Kosten bilden und die Differenz nehmen."]}}, "spiel": ["kosten", "leistung"]};
  var T=D.aufgaben, ORDER=D.reihenfolge;
  document.querySelector('.sub').textContent='Ergebnisse prüfen · '+D.thema;
  var app=document.getElementById('app');
  function el(t,c,h){var e=document.createElement(t); if(c) e.className=c; if(h!==undefined) e.innerHTML=h; return e}
  var m=/[?&]a=(\d+)/.exec(location.search), a=m&&T[m[1]]?m[1]:null;

  // Fortschritt: richtig gelöste Aufgaben (Liste der Nummern) im Browserspeicher; die Spiele lesen denselben Schlüssel.
  var N=ORDER.length, NEED=Math.floor((N*4+4)/5), KEY='ls-fort-'+D.kennung, mem=[], onRefresh=[];
  function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'[]'); if(Array.isArray(v)) return v.map(String)}catch(e){} return mem}

  function markDone(k){var s=load(); if(s.indexOf(k)<0){s.push(k); mem=s; try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}} refresh()}
  var prog=el('div','card prog'), pt=el('div','pt'), ptL=el('span','','Fortschritt'), ptR=el('b'), bar=el('div','bar'), fill=el('i'), cs=el('div','cs');

  function refresh(){
    var n=doneList().length, p=Math.floor(n*100/N), frei=n>=NEED;
    ptL.textContent=n+' von '+N+' richtig'; ptR.textContent=p+' %'; fill.style.width=p+'%'; bar.className='bar'+(frei?' frei':'');
    if(!D.spiel){cs.style.display='none'; bar.querySelector('u').style.display='none'}
    var W="Spiel"; cs.className='cs'+(frei?' frei':''); cs.textContent='';
    if(frei){ cs.appendChild(document.createTextNode(W+' freigeschaltet. ')); if(D.spiel){var g=el('a','','Spiel starten →'); g.href='../'+D.spiel[0]+'/?t='+encodeURIComponent(D.spiel[1]); g.style.color='var(--ok)'; cs.appendChild(g)} }

  }

  if(!a){

    var g=el('div','pick'), links={}; ORDER.forEach(function(k){var l=el('a','','Aufgabe '+k); l.href='?a='+k; g.appendChild(l); links[k]=l}); app.appendChild(g);
    onRefresh.push(function(){var s=doneList(); ORDER.forEach(function(k){var ok=s.indexOf(k)>=0; links[k].className=ok?'done':''; links[k].textContent='Aufgabe '+k+(ok?' ✓':'')})});
    refresh(); return;
  }

  var d=T[a], card=el('div','card'), intro=el('p','','Trage dein Ergebnis ein und tippe auf „Prüfen“.'), fin=el('div','fin','✓ Diese Aufgabe ist bereits richtig gelöst.');
  card.appendChild(el('h2','','Aufgabe '+a+': '+d.titel)); card.appendChild(intro); card.appendChild(fin); app.appendChild(card);
  onRefresh.push(function(){fin.className='fin'+(doneList().indexOf(a)>=0?' show':'')});
  var form=el('div','card'); app.appendChild(form);
  var fields=[], fails=0;

    var inw=el('div','in'), inp, sel, inp2;

    }
    var st=el('div','st','·'), fb=el('div','fb');

  var msg=el('div','msg'); form.appendChild(msg);

  // Hilfe: bis zu drei Stufen (grün, gelb, orange); angezeigt werden nur vorhandene. Eine Stufe öffnet die nächste vorhandene.
  var HF=[['#3ddc84','Grün','Ein Denkanstoß'],['#f5c542','Gelb','Ein Hinweis zum Weg'],['#ff8a3d','Orange','Der nächste Schritt']], hs=[];

  if(hs.length){
    var hc=el('div','card hlp'); hc.appendChild(el('h3','','Hilfe')); app.appendChild(hc);
    hs.forEach(function(h,k){

      b.type='button'; if(k) b.disabled=true; dot.style.background=f[0];
      b.appendChild(dot); b.appendChild(el('span','t',f[1]+' · '+f[2])); b.appendChild(st); row.appendChild(b); row.appendChild(body); hc.appendChild(row);

  }

  function setOk(x){x.st.className='st ok'; x.st.textContent='✓'; x.fb.className='fb'}
  function setNo(x,text){x.st.className='st no'; x.st.textContent='!'; if(text){x.fb.textContent=text; x.fb.className='fb show'} else x.fb.className='fb'}

  function checkField(x){
    var f=x.f;

      var fl=f.falsch||[]; for(var i=0;i<fl.length;i++){ var base=fl[i][0]; if(Math.abs(got-base)<=Math.abs(base)*0.012||Math.abs(n-base)<=Math.abs(base)*0.012) return {ok:false,text:fl[i][1]} }

    }
    if(f.t==='ratio'){
      var p=parse(x.inp.value), q=parse(x.inp2.value); if(isNaN(p)||isNaN(q)||q===0) return {ok:false,leer:true,text:'Bitte beide Zahlen eingeben.'};

    return v===f.r?{ok:true}:{ok:false,text:''};
  }

  function check(){
    var ok=0, leer=0, wrong=0;
    fields.forEach(function(x){
      var r=checkField(x);
      if(r.ok){setOk(x);ok++} else if(r.leer){setNo(x,r.text);leer++} else {setNo(x,r.text);wrong++}
    });
    msg.className='msg show'; form.classList.remove('pop'); void form.offsetWidth;
    if(fields.length&&ok===fields.length){
      markDone(a);
      msg.className='msg show ok'; msg.innerHTML='<b>Alles richtig.</b> Gut gerechnet!'+next(); form.classList.add('pop'); if(navigator.vibrate){try{navigator.vibrate(40)}catch(e){}}
      bShow.style.display='none';
    } else {
      if(wrong>0) fails++;
      msg.className='msg show warn';
      msg.innerHTML='<b>'+ok+' von '+fields.length+' richtig.</b> '+(leer?'Fülle noch alle Felder aus. ':'')+'Überlege noch einmal.<br><small>'+d.hinweis+'</small>';
      if(fails>=2) bShow.style.display='inline-block';
    }
  }
  function next(){var i=ORDER.indexOf(a); return i<ORDER.length-1?'<br><small><a style="color:var(--cyan)" href="?a='+ORDER[i+1]+'">Weiter zu Aufgabe '+ORDER[i+1]+'</a></small>':''}
  bCheck.addEventListener('click',check);
  bShow.addEventListener('click',function(){mu.className='muster show'; mu.innerHTML='<b>Ergebnis</b>\n'+d.muster+(d.nur?'\n\n<small>'+d.nur+'</small>':'')});
  if(d.nur){ var b2=el('button','btn sec','Teil b) vergleichen'); b2.type='button'; btns.appendChild(b2); b2.addEventListener('click',function(){mu.className='muster show'; mu.innerHTML='<b>Musterantwort</b>\n'+d.muster}) }

  var nav=el('div','nav'); var i=ORDER.indexOf(a);
  nav.appendChild(i>0?(function(){var l=el('a','','← Aufgabe '+ORDER[i-1]); l.href='?a='+ORDER[i-1]; return l})():el('span','',''));
  var all=el('a','','Alle Aufgaben'); all.href='kontrolle.html'; nav.appendChild(all);
  nav.appendChild(i<ORDER.length-1?(function(){var l=el('a','','Aufgabe '+ORDER[i+1]+' →'); l.href='?a='+ORDER[i+1]; return l})():el('span','',''));
  app.appendChild(nav);
  refresh();

  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  window.__kontrolle={fill:function(vals){fields.forEach(function(x,k){var v=vals[k]; if(v===undefined) return; if(x.f.t==='num'){x.inp.value=v[0]; x.sel.value=v[1]||0} else if(x.f.t==='ratio'){x.inp.value=v[0]; x.inp2.value=v[1]} else x.sel.value=v})},check:check};   // nur zum Testen
})();
</script>
