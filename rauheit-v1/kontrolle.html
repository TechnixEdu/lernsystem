<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
<title>Ergebnis-Kontrolle: Reihenschaltung</title>
<style>
/* Fenster: neutrale Titelleiste, durchscheinende Werkzeugleiste, gruppierte Karten. Gedämpfte Farben: ein ruhiger Blaugrauton als Akzent, Grün, Ocker und Gold nur mit Bedeutung. Hell und dunkel automatisch */
:root{--lsb-stil:apple;--desk:linear-gradient(135deg,#cfd9ee 0%,#e6dff0 55%,#f3e6df 100%);--win:#f5f5f7;--bar:rgba(246,246,248,.82);--bg:#f5f5f7;--card:#ffffff;--label:#1d1d1f;--sec:#6e6e73;--ter:#8e8e93;--sep:rgba(0,0,0,.12);--tint:#3d6a9e;--tintbg:rgba(61,106,158,.11);--on-tint:#ffffff;--ok:#3f7d5c;--okbg:rgba(63,125,92,.12);--warn:#a46a22;--warnbg:rgba(164,106,34,.12);--fill:rgba(0,0,0,.055);--reward:#c4932f;--g1:#6aae8a;--g2:#d8b658;--g3:#d68f55;--cyan:var(--tint);--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;--disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Consolas,monospace;--serif:"New York",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:linear-gradient(135deg,#1b2238 0%,#2a2140 55%,#35252c 100%);--win:#1e1e1e;--bar:rgba(44,44,46,.82);--bg:#1e1e1e;--card:#2c2c2e;--label:#f5f5f7;--sec:#a1a1a6;--ter:#8e8e93;--sep:rgba(255,255,255,.12);--tint:#86aedb;--tintbg:rgba(134,174,219,.16);--on-tint:#0e1a2a;--ok:#7cc4a0;--okbg:rgba(124,196,160,.14);--warn:#e0b56a;--warnbg:rgba(224,181,106,.14);--fill:rgba(255,255,255,.09);--reward:#d9b35a;--g1:#7cc4a0;--g2:#dcc06a;--g3:#e0a070;color-scheme:dark}}
:root[data-theme="dark"]{--desk:linear-gradient(135deg,#1b2238 0%,#2a2140 55%,#35252c 100%);--win:#1e1e1e;--bar:rgba(44,44,46,.82);--bg:#1e1e1e;--card:#2c2c2e;--label:#f5f5f7;--sec:#a1a1a6;--ter:#8e8e93;--sep:rgba(255,255,255,.12);--tint:#86aedb;--tintbg:rgba(134,174,219,.16);--on-tint:#0e1a2a;--ok:#7cc4a0;--okbg:rgba(124,196,160,.14);--warn:#e0b56a;--warnbg:rgba(224,181,106,.14);--fill:rgba(255,255,255,.09);--reward:#d9b35a;--g1:#7cc4a0;--g2:#dcc06a;--g3:#e0a070;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--label);font:400 1.0625rem/1.4 var(--sans);-webkit-font-smoothing:antialiased;hyphens:auto;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.win{max-width:620px;margin:0 auto;background:var(--win);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 22px 60px rgba(0,0,0,.28)}
.toolbar{padding:10px 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--sep)}
.content{padding:20px 20px 34px;max-width:520px;margin:0 auto}
@media (max-width:520px){body{padding-block:0;padding-left:0;padding-right:0}.win{border-radius:0;box-shadow:none;min-height:100vh}.content{padding:16px max(16px,env(safe-area-inset-right,0px)) 34px max(16px,env(safe-area-inset-left,0px))}}
a{color:var(--tint)}
/* Umschalter */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:9px;padding:2px;max-width:420px;margin:0 auto}
.seg a{text-align:center;text-decoration:none;color:var(--label);font:600 .9375rem/1 var(--sans);padding:10px 8px;border-radius:8px;min-height:40px;display:flex;align-items:center;justify-content:center}
.seg a.an{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.06)}
:root[data-theme="dark"] .seg a.an{background:var(--card)}
h2{font:600 .8125rem/1 var(--sans);color:var(--sec);text-transform:uppercase;letter-spacing:.05em;margin:24px 16px 8px}
h2.aufg{font:600 1.25rem/1.25 var(--sans);text-transform:none;letter-spacing:0;color:var(--label);margin:0 0 4px}
.card{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--sep);margin-bottom:12px;padding:14px 16px;overflow:hidden}
.card h2{margin:0 0 4px;font:600 1.25rem/1.25 var(--sans);text-transform:none;letter-spacing:0;color:var(--label)}
.card p{margin:0;color:var(--sec);font-size:.9375rem;line-height:1.4}
/* Fortschritt */
.prog .pt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog .pt span{font:700 1.5rem/1 var(--disp);letter-spacing:-.02em}
.prog .pt b{font-size:.9375rem;color:var(--sec);font-weight:500}
.bar{position:relative;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tint);border-radius:4px}
.bar.frei i{background:var(--ok)}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--card)}
.prog .cs{margin-top:10px;font-size:.9375rem;color:var(--sec)}
.prog .cs.frei{color:var(--ok)}
/* Aufgabenwahl */
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.pick a{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:12px 16px;border-radius:14px;background:var(--card);color:var(--label);text-decoration:none;font:600 1.0625rem/1.2 var(--sans)}
.pick a.done{color:var(--ok)}
/* Felder */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 0;border-top:1px solid var(--sep)}
.card>.row:first-child,form .row:first-of-type{border-top:0}
.lab{flex:1 1 100%;font-size:.9375rem;color:var(--sec)}
.lab i{font-style:italic;color:var(--label)}
.in{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;max-width:100%}
input[type=text]{font:500 1.25rem/1 var(--mono);color:var(--label);background:var(--fill);border:2px solid transparent;border-radius:12px;padding:13px 14px;width:9rem;min-width:0}
input.sm{width:5rem}
select{font:inherit;font-size:1.0625rem;color:var(--label);background:var(--fill);border:2px solid transparent;border-radius:12px;padding:12px 12px;max-width:100%;min-width:0}
.in select.wide{width:100%;text-overflow:ellipsis}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tint);outline-offset:1px}
.st{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .875rem/1 var(--sans);color:transparent;background:var(--fill)}
.st.ok{background:var(--ok);color:var(--card)}
.st.no{background:var(--warn);color:var(--card)}
.fb{flex:1 1 100%;display:none;font-size:.9375rem;color:var(--warn);background:var(--warnbg);border-radius:10px;padding:9px 12px;line-height:1.4}
.fb.show{display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{appearance:none;border:0;background:var(--tint);color:var(--on-tint);font:600 1.0625rem/1 var(--sans);padding:15px 22px;border-radius:14px;cursor:pointer;min-height:48px}
.btn:active{opacity:.8}
.btn.sec{background:var(--tintbg);color:var(--tint)}
.msg{display:none;margin-top:12px;border-radius:12px;padding:12px 14px;font-size:1rem;line-height:1.45;background:var(--fill)}
.msg.show{display:block}
.msg.ok{background:var(--okbg)}
.msg.warn{background:var(--warnbg)}
.msg b{font-weight:600}
.msg small{color:var(--sec);font-size:.9375rem}
.muster{display:none;margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--okbg);font:400 1.0625rem/1.5 var(--serif);white-space:pre-line}
.muster.show{display:block}
.muster b{font:600 .8125rem/1 var(--sans);color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.fin{display:none;margin-top:8px;font-size:.9375rem;color:var(--ok);font-weight:600}
.fin.show{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin:6px 4px 0;font-size:.9375rem}
.nav a{text-decoration:none}
.note{margin:16px 4px 0;font-size:.8125rem;color:var(--sec);line-height:1.5}
.note a{color:var(--sec)}
.note a.tl{color:var(--tint);font-weight:600;font-size:.9375rem;display:inline-block;margin-top:8px}
.mitte{text-align:center}
/* Hilfe */
.hlp h3{margin:0 0 6px;font:600 .8125rem/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--sec)}
.hl{border-top:1px solid var(--sep)}
.hl:first-of-type{border-top:0}
.hh{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 0;background:none;border:0;color:var(--label);font:inherit;font-size:1.0625rem;text-align:left;cursor:pointer}
.hh[disabled]{cursor:default;color:var(--ter)}
.hh .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%}
.hh[disabled] .dot{opacity:.45}
.hh .t{flex:1}
.hh .s{font-size:.9375rem;color:var(--ter);font-weight:400}
.hl.open .hh .s{color:var(--sec)}
.hb{display:none;margin:0 0 12px 24px;font-size:1rem;line-height:1.5;color:var(--label)}
.hl.open .hb{display:block}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.012)}100%{transform:scale(1)}}
/* Regal */
.zahlen{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--sep)}
.zahlen div{padding:14px 4px 0}
.zahlen div+div{border-left:1px solid var(--sep)}
.zahlen b{display:block;font:700 1.5rem/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.zahlen span{display:block;font-size:.75rem;color:var(--sec);margin-top:4px;line-height:1.25}
.fach{padding:14px 16px 16px}
.fk{display:flex;align-items:center;gap:12px}
.fk .ic{font-size:1.5rem;line-height:1}
.fk .na{flex:1;font:600 1.125rem/1.2 var(--sans);color:var(--label);text-decoration:none}
.pips{display:flex;gap:5px}.pips b{width:10px;height:10px;border-radius:50%;background:var(--fill)}
.bal{display:grid;grid-template-columns:6.5rem 1fr 2.6rem;gap:10px;align-items:center;margin-top:11px;font-size:.875rem;color:var(--sec)}
.bal .bar{height:6px}
.bal .bar.gr i{background:var(--ok)}
.bal .bar.bl i{background:var(--tint)}
.bal em{font-style:normal;text-align:right;color:var(--label);font-variant-numeric:tabular-nums;font-size:.8125rem}
.stolper{margin-top:12px;font-size:.875rem;color:var(--sec);line-height:1.9}
.stolper a{color:var(--warn);text-decoration:none;background:var(--warnbg);border-radius:8px;padding:4px 10px;margin-right:6px;white-space:nowrap;display:inline-block}
.stolper a.ok{color:var(--ok);background:var(--okbg)}
.liste{padding:2px 16px}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--sep)}
.li:first-child{border-top:0}
.li .em{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:1.375rem;line-height:1}
.li .t{flex:1;min-width:0}
.li .na{font:600 1.0625rem/1.25 var(--sans);color:var(--label)}
.li .dt{font-size:.8125rem;color:var(--ter)}
.li .zz{text-align:right;font:600 1.0625rem/1.25 var(--sans);color:var(--sec);font-variant-numeric:tabular-nums;white-space:nowrap}
.li .zz small{display:inline;font:400 1.0625rem/1.25 var(--sans);color:var(--sec);margin-left:.3em;letter-spacing:0}
textarea{width:100%;height:5.5rem;font:.8125rem/1.4 var(--mono);color:var(--label);background:var(--fill);border:2px solid transparent;border-radius:12px;padding:10px;resize:vertical;word-break:break-all}
details summary{cursor:pointer;font-size:1.0625rem;min-height:32px}
details p{margin:8px 0}
.mel{font-size:.9375rem;margin-top:8px;min-height:1em}
label.tg{display:flex;align-items:center;gap:10px;font-size:.9375rem;margin-top:12px;color:var(--sec);min-height:36px}
label.tg input{width:20px;height:20px;accent-color:var(--tint)}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
#stats{text-align:center;padding:14px 16px}
#stats .zahlen{margin-top:0;border-top:0}
#stats .zahlen div{padding-top:0}
.content{padding-top:16px}
button,summary,details,label,select,input,a{font-family:var(--sans)}
input[type=text],textarea{font-family:var(--mono)}
details summary{font:500 1.0625rem/1.3 var(--sans);list-style-position:inside}
.rang{display:flex;justify-content:flex-start;align-items:center;gap:14px;text-align:left;padding:16px}
.rang .rem{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:color-mix(in srgb,var(--reward) 16%,var(--card));display:flex;align-items:center;justify-content:center;font-size:1.625rem;line-height:1}
.rang .rl{color:var(--sec);font-size:.8125rem}
.rang .rn{font:700 1.375rem/1.2 var(--disp);letter-spacing:-.01em}
.bar u{left:80%}
.li.offen{opacity:.55}.li.offen .dt{white-space:normal}
.li .zz small.u{display:block;margin:0;font-size:.75rem;color:var(--ter)}

</style>
</head>
