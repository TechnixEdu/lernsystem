<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0506">
<title>Bombe entschärfen</title>
<style>

:root{--bg:#0b0506;--panel:#160c0d;--line:#3b1c1f;--text:#f3dede;--dim:#a98084;--a:#ff3b3b;--a2:#8f1f23;--ok:#35ffa0;--bad:#ff4d4d;--warn:#ffd23a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(800px 380px at 50% -120px,rgba(255,59,59,.18),transparent 70%),var(--bg);padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:460px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
h1{font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin:0;color:var(--a);font-weight:700}
.sub{font-size:12px;color:var(--dim);margin-top:3px}
.stat{font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--warn);white-space:nowrap}
.done .stat{color:var(--ok)}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:10px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage svg{width:100%;height:auto;display:block}
.panel{margin-top:10px;background:var(--panel);border:1px solid var(--a2);border-radius:14px;padding:14px}
.panel .tag{font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--a);margin-bottom:6px}
.panel .q{font-size:14.5px;line-height:1.5;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;font-size:16px;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--a2);border-radius:8px;padding:9px 10px;min-width:0}
input{width:110px;font-family:ui-monospace,Consolas,monospace}
input:focus,select:focus{outline:2px solid var(--a);outline-offset:1px}
.btn{appearance:none;border:1px solid var(--a);background:rgba(255,59,59,.12);color:var(--a);font:700 13px ui-monospace,Consolas,monospace;letter-spacing:.16em;padding:11px 18px;border-radius:10px;cursor:pointer;box-shadow:0 0 16px rgba(255,59,59,.22)}
.btn:active{background:rgba(255,59,59,.28)}
.fb{margin-top:10px;font-size:13.5px;line-height:1.45;color:var(--warn);min-height:1em}
.end{display:none;margin-top:12px;border:1px solid var(--ok);border-radius:14px;padding:16px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(53,255,160,.15),transparent 70%)}
.end h2{margin:0 0 6px;font-size:17px;letter-spacing:.14em;color:var(--ok);text-transform:uppercase}
.end p{margin:0;font-size:14px;line-height:1.5}
.done .end{display:block;animation:in .6s}
.done .panel{display:none}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.foot{margin-top:14px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.shake,.done .end{animation:none}}


.stage svg .case{fill:#1b1213;stroke:#4a2a2d;stroke-width:1.6}
.stage svg .lcd{fill:#050202;stroke:#6a2a2d;stroke-width:1.4}
.stage svg .tm{font:700 26px ui-monospace,Consolas,monospace;fill:#ff3b3b;text-anchor:middle;filter:drop-shadow(0 0 5px rgba(255,59,59,.8))}
.late .stage svg .tm{animation:bl 1s steps(2) infinite}
.done .stage svg .tm{fill:#35ffa0;filter:drop-shadow(0 0 5px rgba(53,255,160,.8));animation:none}
@keyframes bl{50%{opacity:.25}}
.stage svg .pin{fill:#2a1a1b;stroke:#6a3a3d;stroke-width:1.2}
.stage svg .wire{fill:none;stroke-width:3.2;stroke-linecap:round}
.stage svg .num{font:700 8px ui-monospace,Consolas,monospace;fill:#a98084;text-anchor:middle}
.stage svg .spark{fill:#ffd23a;opacity:0}
.stage svg .spark.go{animation:sp .6s ease-out}
@keyframes sp{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
.stage svg .lbl{font:700 7px ui-monospace,Consolas,monospace;fill:#a98084}
@media (prefers-reduced-motion:reduce){.late .stage svg .tm{animation:none}.stage svg .spark.go{animation:none}}

</style>
</head>
<body>
<div class="wrap" id="app">
  <header><div><h1 id="h1"></h1><div class="sub" id="sub"></div></div><div class="stat" id="st"></div></header>
  <div class="intro" id="intro"></div>
  <div class="stage"><svg viewBox="0 0 300 175" aria-label="Sprengsatz"><rect class="case" x="8" y="6" width="284" height="163" rx="14"/><rect class="lcd" x="92" y="16" width="116" height="38" rx="6"/><text id="tm" class="tm" x="150" y="44">10:00</text><text class="lbl" x="98" y="64">ZEIT</text><rect class="pin" x="22" y="74" width="12" height="76" rx="3"/><rect class="pin" x="266" y="74" width="12" height="76" rx="3"/><g id="wz"></g></svg></div>
  <div class="panel" id="panel"></div>
  <div class="end" id="end"><h2 id="et"></h2><p id="ep"></p></div>
  <p class="foot">Funktioniert ohne Internet, sobald die Seite einmal geladen wurde.<br>Die Challenge ist freiwillig und hat keinen Einfluss auf die Bewertung.<br><a href="https://technixedu.de/datenschutz.html" style="color:inherit">Datenschutz</a></p>
</div>
<script>
(function(){
  'use strict';
  var D={"titel": "Bombe entschärfen", "untertitel": "Challenge · Reihenschaltung (freiwillig)", "einleitung": "Der Zünder hängt an vier Drähten, der Timer läuft. Trenne jeden Draht mit dem richtigen Wert aus deinen Ergebnissen durch. Ein falscher Wert kostet 30 Sekunden.", "stufen": [{"name": "Rot", "frage": "Gesamtwiderstand aus Aufgabe 2", "t": "num", "e": "Ohm", "v": 500, "falsch": [[100, "Du brauchst alle drei Widerstände zusammen."]], "hinweis": "Alle drei Widerstände addieren."}, {"name": "Blau", "frage": "Spannung <i>U</i><sub>3</sub> aus Aufgabe 2", "t": "num", "e": "V", "v": 12, "falsch": [[24, "Die 24 V verteilen sich auf alle drei Widerstände."]], "hinweis": "Strom mal der größte Widerstand."}, {"name": "Gelb", "frage": "Strom durch die LED aus Aufgabe 3 mit dem eingebauten Normwiderstand", "t": "num", "e": "A", "v": 0.017857, "falsch": [[0.02, "Das wäre der Strom mit dem berechneten 500-Ω-Widerstand. Rechne mit dem eingebauten Normwert."]], "hinweis": "Spannung am Vorwiderstand durch den eingebauten Widerstand."}, {"name": "Grün", "frage": "Spannung <i>U</i><sub>2</sub> am Spannungsteiler aus Aufgabe 4", "t": "num", "e": "V", "v": 18, "falsch": [[6, "Der größere Widerstand bekommt die größere Spannung."]], "hinweis": "Die Teilspannungen verhalten sich wie die Widerstände."}], "abschluss_titel": "Entschärft", "abschluss_text": "Alle Drähte sind durchtrennt, der Timer steht. Sauber gerechnet. Zur Belohnung ist Snake freigeschaltet.", "snake": "reihenschaltung"};
  var EH={Ohm:[['Ω',1],['kΩ',1000]],V:[['V',1],['mV',0.001]],A:[['A',1],['mA',0.001]],W:[['W',1],['kW',1000]],plain:[['',1]]};
  var S=D.stufen, idx=0, fails=0, app=document.getElementById('app'), panel=document.getElementById('panel'), stat=document.getElementById('st');
  document.getElementById('h1').textContent=D.titel; document.getElementById('sub').textContent=D.untertitel; document.title=D.titel; document.getElementById('intro').innerHTML=D.einleitung;
  document.getElementById('et').textContent=D.abschluss_titel; document.getElementById('ep').innerHTML=D.abschluss_text;
  var NS='http://www.w3.org/2000/svg';
  function el(n,a,p){var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e}
  var SK={};

  var COL=['#ff4d4d','#4da6ff','#ffd23a','#35ffa0','#ff8a1f','#d58bff'], T=600, W=[], tmEl=document.getElementById('tm'), timer=0, ended=false, TOTAL=S.length;
  function fmt(t){var m=Math.floor(t/60), s=t%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
  function draw(){tmEl.textContent=fmt(T); app.classList.toggle('late',T<=60&&!ended)}
  SK.init=function(){
    var root=document.getElementById('wz'), y0=78, dy=Math.min(20,66/(Math.max(1,TOTAL-1)));
    S.forEach(function(st,i){
      var y=y0+i*dy, d='M34,'+y+' C100,'+(y-9)+' 200,'+(y+9)+' 266,'+y;
      var w=el('path',{class:'wire',d:d,stroke:COL[i%COL.length],pathLength:'1'},root);
      var sp=el('circle',{class:'spark',cx:150,cy:y,r:7},root);
      var nm=el('text',{class:'num',x:46,y:y-4},root); nm.textContent=String(i+1);
      W.push({w:w,sp:sp});
    });
    draw();
    timer=setInterval(function(){ if(ended) return; T--; if(T<=0){T=300; var fb=panel.querySelector('.fb'); if(fb) fb.textContent='Zeit abgelaufen. Der Timer wurde auf 05:00 zurückgesetzt, dein Fortschritt bleibt.'} draw() },1000);
  };
  SK.stat0='SPRENGSATZ AKTIV'; SK.btn='DURCHTRENNEN';
  SK.tag=function(i,n,nm){return 'DRAHT '+(i+1)+' VON '+n+' · '+nm.toUpperCase()};
  SK.statN=function(i,n){return i+' / '+n+' DURCH'}; SK.statEnd='ENTSCHÄRFT';
  SK.onOk=function(i){var o=W[i]; o.w.style.strokeDasharray='0.44 0.12 0.44'; o.w.style.strokeDashoffset='0'; o.w.style.opacity='.75'; o.sp.setAttribute('class','spark go')};
  SK.onFail=function(){T=Math.max(1,T-30); draw()};
  SK.fail=function(){return 'Falscher Draht! −30 Sekunden.'};
  SK.done=function(){ended=true; clearInterval(timer); draw(); tmEl.textContent=fmt(T)};

  function parse(s){s=(s||'').toString().trim().replace(',','.'); return s===''?NaN:Number(s)}
  function pruefe(st,val,sel){
    if(st.t==='wahl'){var v=+val; if(v<0) return {leer:true,text:'Bitte eine Antwort wählen.'}; return {ok:v===st.r}}
    var n=parse(val); if(isNaN(n)) return {leer:true,text:'Bitte eine Zahl eingeben.'};
    var eh=st.einheiten||EH[st.e||'plain']; var got=n*eh[+sel][1], exp=st.v, tol=st.tol||0.012;
    if(Math.abs(got-exp)<=Math.abs(exp)*tol) return {ok:true};
    var r=got/exp; if(Math.abs(r/1000-1)<0.02||Math.abs(r*1000-1)<0.02) return {ok:false,text:'Der Zahlenwert passt fast, aber die Einheit nicht.'};
    var fl=st.falsch||[]; for(var i=0;i<fl.length;i++){var b=fl[i][0]; if(Math.abs(got-b)<=Math.abs(b)*0.012||Math.abs(n-b)<=Math.abs(b)*0.012) return {ok:false,text:fl[i][1]}}
    return {ok:false};
  }
  function show(){
    panel.innerHTML=''; if(idx>=S.length) return;
    var st=S[idx]; var tg=document.createElement('div'); tg.className='tag'; tg.textContent=SK.tag(idx,S.length,st.name); panel.appendChild(tg);
    var q=document.createElement('div'); q.className='q'; q.innerHTML=st.frage; panel.appendChild(q);
    var row=document.createElement('div'); row.className='row'; var inp,sel;
    if(st.t==='wahl'){sel=document.createElement('select'); var o0=document.createElement('option'); o0.value='-1'; o0.textContent='– wählen –'; sel.appendChild(o0); st.o.forEach(function(x,k){var o=document.createElement('option'); o.value=k; o.textContent=x; sel.appendChild(o)}); row.appendChild(sel)}
    else{inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal'; inp.autocomplete='off'; row.appendChild(inp); var eh=st.einheiten||EH[st.e||'plain']; if(eh.length>1||eh[0][0]){sel=document.createElement('select'); eh.forEach(function(u,k){var o=document.createElement('option'); o.value=k; o.textContent=u[0]; sel.appendChild(o)}); row.appendChild(sel)} else sel={value:0}}
    var b=document.createElement('button'); b.className='btn'; b.type='button'; b.textContent=SK.btn; row.appendChild(b); panel.appendChild(row);
    var fb=document.createElement('div'); fb.className='fb'; panel.appendChild(fb);
    function go(){
      var r=pruefe(st, st.t==='wahl'?sel.value:inp.value, sel.value);
      if(r.leer){fb.textContent=r.text; return}
      if(r.ok){ SK.onOk(idx); idx++; fails=0;
        if(idx>=S.length){ app.classList.add('done'); stat.textContent=SK.statEnd; if(SK.done) SK.done(); if(navigator.vibrate){try{navigator.vibrate([50,40,100])}catch(e){}} }
        else { stat.textContent=SK.statN(idx,S.length); show() } }
      else { fails++; app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); if(SK.onFail) SK.onFail();
        fb.textContent=SK.fail()+(r.text?' '+r.text:' Rechne noch einmal.')+(fails>=3&&st.hinweis?' Hinweis: '+st.hinweis:'') }
    }
    b.addEventListener('click',go); if(inp) inp.addEventListener('keydown',function(e){if(e.key==='Enter') go()});
    window.__go=go; window.__set=function(v,u){ if(inp) inp.value=v; if(sel&&u!==undefined) sel.value=u; if(st.t==='wahl') sel.value=v };
  }
  SK.init(); stat.textContent=SK.stat0; show();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
<script>(function(){var T="reihenschaltung",app=document.getElementById('app');if(!app)return;function frei(){if(!app.classList.contains('done')||app.__frei)return;app.__frei=1;try{localStorage.setItem('ls-frei-'+T,'1')}catch(e){}var e=document.getElementById('end');if(e){var a=document.createElement('a');a.className='btn';a.href='../snake/?t='+T;a.textContent='SNAKE SPIELEN';a.style.cssText='display:inline-block;margin-top:12px;text-decoration:none';e.appendChild(a)}}new MutationObserver(frei).observe(app,{attributes:true,attributeFilter:['class']});frei()})();</script>
</body>
</html>
