<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a06">
<title>Crime Scene</title>
<style>
:root{--bg:#0c0a06;--panel:#17130b;--line:#3b3220;--text:#efe7d4;--dim:#a39572;--a:#e8b84a;--a2:#8a6a1c;--ok:#5dffb0;--bad:#ff5a5a;--warn:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(800px 380px at 50% -120px,rgba(232,184,74,.16),transparent 70%),repeating-linear-gradient(0deg,rgba(232,184,74,.03) 0 1px,transparent 1px 26px),var(--bg);padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:460px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
h1{font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin:0;color:var(--a);font-weight:700}
.sub{font-size:12px;color:var(--dim);margin-top:3px}
.stat{font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--warn);white-space:nowrap}
.done .stat{color:var(--ok)}
.case{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--a);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.55;margin-bottom:12px}
h3{margin:14px 0 8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--a)}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ev.ok{border-color:#2f6a4a}
.ev .t{font-weight:600;font-size:14px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.ev .t span{font:700 10.5px ui-monospace,Consolas,monospace;color:var(--a);border:1px solid var(--a2);border-radius:5px;padding:2px 6px;letter-spacing:.08em}
.ev .q{font-size:14px;line-height:1.5;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;font-size:16px;color:var(--text);background:#0b0904;border:1px solid var(--a2);border-radius:8px;padding:9px 10px;min-width:0}
input{width:110px;font-family:ui-monospace,Consolas,monospace}
input:focus,select:focus{outline:2px solid var(--a);outline-offset:1px}
.btn{appearance:none;border:1px solid var(--a);background:rgba(232,184,74,.12);color:var(--a);font:700 13px ui-monospace,Consolas,monospace;letter-spacing:.14em;padding:11px 16px;border-radius:10px;cursor:pointer;box-shadow:0 0 14px rgba(232,184,74,.18)}
.btn:active{background:rgba(232,184,74,.28)}
.fb{margin-top:8px;font-size:13.5px;line-height:1.45;color:var(--warn);min-height:1em}
.befund{display:none;margin-top:8px;border-top:1px dashed var(--a2);padding-top:8px;font-size:14px;line-height:1.5;color:var(--ok)}
.ev.ok .befund{display:block;animation:in .4s}
.ev.ok .row,.ev.ok .fb{display:none}
.sus{display:grid;gap:8px}
.s{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.45}
.s b{color:var(--a)}
.s input{width:auto;accent-color:var(--a);margin-right:8px;vertical-align:middle}
.s.pick{border-color:var(--a)}
.accuse{display:none}
.ready .accuse{display:block}
.end{display:none;margin-top:12px;border:1px solid var(--ok);border-radius:12px;padding:16px;background:radial-gradient(circle at 50% 0,rgba(93,255,176,.14),transparent 70%)}
.end h2{margin:0 0 6px;font-size:16px;letter-spacing:.14em;color:var(--ok);text-transform:uppercase}
.end p{margin:0;font-size:14px;line-height:1.55}
.done .end{display:block;animation:in .6s}
.done .accuse .btn{display:none}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.foot{margin-top:14px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5}
@media (prefers-reduced-motion:reduce){.ev.ok .befund,.done .end{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header><div><h1 id="h1"></h1><div class="sub" id="sub"></div></div><div class="stat" id="st">FALL OFFEN</div></header>
  <div class="case" id="case"></div>
  <h3>Beweise prüfen</h3>
  <div id="evs"></div>
  <div class="accuse" id="acc">
    <h3>Verdächtige</h3>
    <div class="sus" id="sus"></div>
    <p class="fb" id="afb"></p>
    <button class="btn" id="abtn" type="button">TÄTER BENENNEN</button>
  </div>
  <div class="end" id="end"><h2 id="et"></h2><p id="ep"></p></div>
  <p class="foot">Funktioniert ohne Internet, sobald die Seite einmal geladen wurde.<br>Der Fall ist freiwillig und hat keinen Einfluss auf die Bewertung.<br><a href="https://technixedu.de/datenschutz.html" style="color:inherit">Datenschutz</a></p>
</div>
<script>
(function(){
  'use strict';
  var D={"titel": "Crime Scene", "untertitel": "Challenge · Rückfederung (freiwillig)", "einleitung": "In der Serie haben die Winkelbleche 86,4° statt 90°. Drei Personen hatten mit dem Werkzeug zu tun. Prüfe die Beweise und finde heraus, wessen Aussage nicht stimmt.", "stufen": [{"name": "Überbiegung", "frage": "Um wie viel Grad muss das Werkzeug aus Aufgabe 2 weiter biegen als der Winkel am fertigen Teil?", "t": "num", "e": "plain", "v": 3.75, "tol": 0.01, "befund": "Das Werkzeug muss 3,75° überbiegen."}, {"name": "Richtiger Werkzeugwinkel", "frage": "Mit welchem Winkel (in Grad) hätte das Werkzeug gebaut werden müssen, damit das Teil 90° bekommt?", "t": "num", "e": "plain", "v": 93.75, "tol": 0.003, "befund": "Das Werkzeug hätte auf 93,75° gebaut werden müssen."}, {"name": "Winkel am Teil", "frage": "Welchen Winkel (in Grad) bekommt das Teil mit einem Werkzeug auf 90°?", "t": "num", "e": "plain", "v": 86.4, "tol": 0.003, "befund": "Bei 90° am Werkzeug bleiben 86,4° am Teil: genau der Fehler der Serie."}], "abschluss_titel": "Fall gelöst", "abschluss_text": "Der Werkzeugmacher hat die Rückfederung nicht eingerechnet. Das Werkzeug biegt auf 90°, das Teil bleibt bei 86,4°.", "verdaechtige": [{"name": "Person A", "aussage": "„Auf meiner Zeichnung steht 90° für das fertige Teil.“"}, {"name": "Person B", "aussage": "„Ich habe das Werkzeug auf 90° gebaut. Das Blech federt kaum zurück.“"}, {"name": "Person C", "aussage": "„Ich habe das Werkzeug nur eingebaut und nichts verstellt.“"}], "taeter": 1};
  var EH={Ohm:[['Ω',1],['kΩ',1000]],V:[['V',1],['mV',0.001]],A:[['A',1],['mA',0.001]],W:[['W',1],['kW',1000]],plain:[['',1]]};
  var S=D.stufen, solved=0, app=document.getElementById('app');
  document.getElementById('h1').textContent=D.titel; document.getElementById('sub').textContent=D.untertitel; document.title=D.titel; document.getElementById('case').innerHTML=D.einleitung;
  function parse(s){s=(s||'').toString().trim().replace(',','.'); return s===''?NaN:Number(s)}
  function pruefe(st,val,sel){
    if(st.t==='wahl'){var v=+val; if(v<0) return {leer:true,text:'Bitte eine Antwort wählen.'}; return {ok:v===st.r}}
    var n=parse(val); if(isNaN(n)) return {leer:true,text:'Bitte eine Zahl eingeben.'};
    var eh=st.einheiten||EH[st.e||'plain']; var got=n*eh[+sel][1], exp=st.v, tol=st.tol||0.012;
    if(Math.abs(got-exp)<=Math.abs(exp)*tol) return {ok:true};
    var r=got/exp; if(Math.abs(r/1000-1)<0.02||Math.abs(r*1000-1)<0.02) return {ok:false,text:'Der Zahlenwert passt fast, aber die Einheit nicht.'};
    var fl=st.falsch||[]; for(var i=0;i<fl.length;i++){var b=fl[i][0]; if(Math.abs(got-b)<=Math.abs(b)*0.012||Math.abs(n-b)<=Math.abs(b)*0.012) return {ok:false,text:fl[i][1]}}
    return {ok:false};
  }
  var fails=[];
  S.forEach(function(st,i){
    var ev=document.createElement('div'); ev.className='ev';
    ev.innerHTML='<div class="t"><span>BEWEIS '+(i+1)+'</span>'+st.name+'</div><div class="q">'+st.frage+'</div>';
    var row=document.createElement('div'); row.className='row'; var inp,sel;
    if(st.t==='wahl'){sel=document.createElement('select'); var o0=document.createElement('option'); o0.value='-1'; o0.textContent='– wählen –'; sel.appendChild(o0); st.o.forEach(function(x,k){var o=document.createElement('option'); o.value=k; o.textContent=x; sel.appendChild(o)}); row.appendChild(sel)}
    else{inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal'; inp.autocomplete='off'; row.appendChild(inp); var eh=st.einheiten||EH[st.e||'plain']; if(eh.length>1||eh[0][0]){sel=document.createElement('select'); eh.forEach(function(u,k){var o=document.createElement('option'); o.value=k; o.textContent=u[0]; sel.appendChild(o)}); row.appendChild(sel)} else sel={value:0}}
    var b=document.createElement('button'); b.className='btn'; b.type='button'; b.textContent='PRÜFEN'; row.appendChild(b); ev.appendChild(row);
    var fb=document.createElement('div'); fb.className='fb'; ev.appendChild(fb);
    var bf=document.createElement('div'); bf.className='befund'; bf.innerHTML='<b>Befund bestätigt:</b> '+st.befund; ev.appendChild(bf);
    fails[i]=0;
    function go(){
      var r=pruefe(st, st.t==='wahl'?sel.value:inp.value, sel.value);
      if(r.leer){fb.textContent=r.text; return}
      if(r.ok){ ev.classList.add('ok'); solved++; if(solved===S.length){ app.classList.add('ready'); document.getElementById('st').textContent='TÄTER BENENNEN' } }
      else { fails[i]++; fb.textContent='Die Spurensicherung widerspricht.'+(r.text?' '+r.text:' Rechne noch einmal.')+(fails[i]>=3&&st.hinweis?' Hinweis: '+st.hinweis:'') }
    }
    b.addEventListener('click',go); if(inp) inp.addEventListener('keydown',function(e){if(e.key==='Enter') go()});
    document.getElementById('evs').appendChild(ev);
    (window.__go=window.__go||[])[i]=go; (window.__set=window.__set||[])[i]=function(v,u){ if(inp) inp.value=v; if(sel&&u!==undefined) sel.value=u; if(st.t==='wahl') sel.value=v };
  });
  var pick=-1, labels=[];
  D.verdaechtige.forEach(function(v,i){
    var l=document.createElement('label'); l.className='s'; l.innerHTML='<input type="radio" name="s"><b>'+v.name+'</b><br>'+v.aussage;
    l.querySelector('input').addEventListener('change',function(){pick=i; labels.forEach(function(x,k){x.classList.toggle('pick',k===i)}); document.getElementById('afb').textContent=''});
    document.getElementById('sus').appendChild(l); labels.push(l);
  });
  document.getElementById('abtn').addEventListener('click',function(){
    var fb=document.getElementById('afb');
    if(pick<0){fb.textContent='Wähle zuerst eine Person.'; return}
    if(pick===D.taeter){ app.classList.add('done'); document.getElementById('st').textContent='FALL GELÖST'; document.getElementById('et').textContent=D.abschluss_titel; document.getElementById('ep').innerHTML=D.abschluss_text; if(navigator.vibrate){try{navigator.vibrate([50,40,100])}catch(e){}} }
    else { fb.textContent=D.falsch_text||'Das passt nicht zu den Beweisen. Vergleiche die Aussagen mit deinen bestätigten Befunden.' }
  });
  window.__pick=function(i){pick=i};
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
</body>
</html>
