<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Hilfe in drei Stufen</title>
<style>
:root{--bg:#070b12;--panel:#0e1623;--panel2:#142034;--line:#1f3050;--text:#dbe7f5;--dim:#7f93ad;--cyan:#19e3ff;--cyan-d:#0a8aa0;--ok:#2dff9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 420px at 50% -120px,rgba(25,227,255,.13),transparent 70%),linear-gradient(rgba(25,227,255,.035) 1px,transparent 1px) 0 0/100% 28px,var(--bg);padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin:0;font-weight:600;color:var(--cyan)}
.sub{font-size:12px;color:var(--dim);letter-spacing:.04em;margin:3px 0 16px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.task h2{margin:0 0 4px;font-size:16px}
.task p{margin:0;color:var(--dim);font-size:13px;line-height:1.4}
.steps{display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.step.lock{opacity:.5}
.head{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.head[disabled]{cursor:default}
.num{flex:0 0 auto;font:700 12px ui-monospace,Consolas,monospace;color:var(--cyan);border:1px solid var(--cyan-d);border-radius:6px;padding:3px 8px;letter-spacing:.06em}
.head .t{flex:1;font-size:14px}
.head .s{font:600 11px ui-monospace,Consolas,monospace;color:var(--dim);letter-spacing:.1em}
.body{display:none;padding:0 14px 14px 14px;font-size:15px;line-height:1.5}
.step.open{border-color:var(--cyan-d);box-shadow:0 0 18px rgba(25,227,255,.14)}
.step.open .body{display:block;animation:in .35s ease}
.step.open .s{color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.note{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.5;text-align:center}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pick a{display:block;text-align:center;border:1px solid var(--cyan-d);border-radius:10px;padding:14px 8px;color:var(--cyan);text-decoration:none;font:700 13px ui-monospace,Consolas,monospace;letter-spacing:.08em;background:rgba(25,227,255,.06)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.step.open .body{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hilfe</h1>
  <div class="sub">in drei Stufen · Reihenschaltung</div>
  <div id="app"></div>
  <p class="note">Versuche es zuerst allein. Öffne eine Stufe erst, wenn du nicht weiterkommst.<br>Funktioniert ohne Internet, sobald die Seite einmal geladen wurde.<br><a href="https://technixedu.de/datenschutz.html" style="color:inherit">Datenschutz</a></p>
</div>
<script>
(function(){
  'use strict';
  var D={"thema": "Rückfederung beim Biegen", "aufgaben": {"2": {"titel": "Werkzeug für den Befestigungswinkel", "stufen": ["Schreibe zuerst auf, was gegeben und was gesucht ist. Du brauchst zuerst den Rückfederungsfaktor. Wovon hängt er ab?", "Tabellenbuch: Rückfederung beim Biegen. Erst das Verhältnis Radius zu Blechdicke bilden, damit den Faktor in der Tabelle suchen.", "Der Werkzeugwinkel ist größer als der Winkel am fertigen Teil: Teile den Winkel am Teil durch den Faktor. Der Radius am Werkzeug ergibt sich mit der Formel für $r_{1}$ aus dem Tabellenbuch."]}, "3": {"titel": "Stahl oder Aluminium", "stufen": ["Rechne beide Werkstoffe nacheinander. Das Verhältnis $r_{2}/s$ ist für beide gleich. Warum?", "Tabellenbuch: Rückfederung beim Biegen. Aus der Tabelle brauchst du zwei Faktoren, je einen pro Werkstoff, in derselben Spalte.", "Vergleiche am Ende die beiden Werkzeugwinkel. Ist der Unterschied klein genug, dass ein Werkzeug für beide reicht?"]}, "4": {"titel": "Reklamation Winkelblech", "stufen": ["Schreibe zuerst auf, was gegeben und was gesucht ist. Der Winkel am Teil ist kleiner oder größer als der am Werkzeug?", "Tabellenbuch: Rückfederung beim Biegen. Die Definition des Rückfederungsfaktors verbindet beide Winkel.", "Der Faktor ist das Verhältnis Winkel am Teil zu Winkel am Werkzeug. Für die Ursachen: Was hat die neue Charge, was die alte nicht hatte? Wovon hängt der Faktor laut Tabelle ab?"]}}};
  var DATA=D.aufgaben;
  document.querySelector('.sub').textContent='in drei Stufen · '+D.thema;
  var app=document.getElementById('app');
  var m=/[?&]a=(\d+)/.exec(location.search); var a=m&&DATA[m[1]]?m[1]:null;
  function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e}
  if(!a){
    app.appendChild(el('div','task')).appendChild(el('p','', 'Wähle die Aufgabe, zu der du Hilfe brauchst.'));
    var g=el('div','pick');
    Object.keys(DATA).forEach(function(k){var l=el('a','', 'Aufgabe '+k); l.href='?a='+k; g.appendChild(l)});
    app.appendChild(g); return;
  }
  var d=DATA[a], t=el('div','task');
  t.appendChild(el('h2','', 'Aufgabe '+a+': '+d.titel));
  t.appendChild(el('p','', 'Jede Stufe verrät etwas mehr. Die Rechnung machst du selbst.'));
  app.appendChild(t);
  var box=el('div','steps'); app.appendChild(box);
  var titles=['Ein Denkanstoß','Ein Hinweis zum Weg','Der nächste Schritt'], steps=[];
  d.stufen.forEach(function(txt,i){
    var s=el('div','step'+(i?' lock':'')), h=el('button','head'); h.type='button'; if(i) h.disabled=true;
    h.appendChild(el('span','num','HILFE '+(i+1))); h.appendChild(el('span','t',titles[i])); var st=el('span','s', i?'GESPERRT':'ÖFFNEN'); h.appendChild(st);
    var b=el('div','body',txt); s.appendChild(h); s.appendChild(b); box.appendChild(s); steps.push({s:s,h:h,st:st});
    h.addEventListener('click',function(){
      s.classList.add('open'); st.textContent='OFFEN'; h.disabled=true;
      if(steps[i+1]){steps[i+1].s.classList.remove('lock'); steps[i+1].h.disabled=false; steps[i+1].st.textContent='ÖFFNEN'}
    });
  });
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
</body>
</html>
