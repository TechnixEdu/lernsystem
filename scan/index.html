<style>
/* Fenster: neutrale Titelleiste, durchscheinende Werkzeugleiste, gruppierte Karten. Gedämpfte Farben: ein ruhiger Blaugrauton als Akzent, Grün, Ocker und Gold nur mit Bedeutung. Hell und dunkel automatisch */
:root{--lsb-stil:apple;--desk:linear-gradient(135deg,#cfd9ee 0%,#e6dff0 55%,#f3e6df 100%);--win:#f5f5f7;--bar:rgba(246,246,248,.82);--bg:#f5f5f7;--card:#ffffff;--label:#1d1d1f;--sec:#6e6e73;--ter:#8e8e93;--sep:rgba(0,0,0,.12);--tint:#3d6a9e;--tintbg:rgba(61,106,158,.11);--on-tint:#ffffff;--ok:#3f7d5c;--okbg:rgba(63,125,92,.12);--warn:#a46a22;--warnbg:rgba(164,106,34,.12);--fill:rgba(0,0,0,.055);--reward:#c4932f;--g1:#6aae8a;--g2:#d8b658;--g3:#d68f55;--cyan:var(--tint);--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;--disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Consolas,monospace;--serif:"New York",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:linear-gradient(135deg,#1b2238 0%,#2a2140 55%,#35252c 100%);--win:#1e1e1e;--bar:rgba(44,44,46,.82);--bg:#1e1e1e;--card:#2c2c2e;--label:#f5f5f7;--sec:#a1a1a6;--ter:#8e8e93;--sep:rgba(255,255,255,.12);--tint:#86aedb;--tintbg:rgba(134,174,219,.16);--on-tint:#0e1a2a;--ok:#7cc4a0;--okbg:rgba(124,196,160,.14);--warn:#e0b56a;--warnbg:rgba(224,181,106,.14);--fill:rgba(255,255,255,.09);--reward:#d9b35a;--g1:#7cc4a0;--g2:#dcc06a;--g3:#e0a070;color-scheme:dark}}
:root[data-theme="dark"]{--desk:linear-gradient(135deg,#1b2238 0%,#2a2140 55%,#35252c 100%);--win:#1e1e1e;--bar:rgba(44,44,46,.82);--bg:#1e1e1e;--card:#2c2c2e;--label:#f5f5f7;--sec:#a1a1a6;--ter:#8e8e93;--sep:rgba(255,255,255,.12);--tint:#86aedb;--tintbg:rgba(134,174,219,.16);--on-tint:#0e1a2a;--ok:#7cc4a0;--okbg:rgba(124,196,160,.14);--warn:#e0b56a;--warnbg:rgba(224,181,106,.14);--fill:rgba(255,255,255,.09);--reward:#d9b35a;--g1:#7cc4a0;--g2:#dcc06a;--g3:#e0a070;color-scheme:dark}

.nav{display:flex;justify-content:space-between;gap:10px;margin:6px 4px 0;font-size:.9375rem}

.mitte{text-align:center}
/* Hilfe */
.hlp h3{margin:0 0 6px;font:600 .8125rem/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--sec)}
.hl{border-top:1px solid var(--sep)}
.hl:first-of-type{border-top:0}
.hh{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 0;background:none;border:0;color:var(--label);font:inherit;font-size:1.0625rem;text-align:left;cursor:pointer}

.hh .t{flex:1}

.hl.open .hh .s{color:var(--sec)}

.zahlen div{padding:14px 4px 0}
.zahlen div+div{border-left:1px solid var(--sep)}
.zahlen b{display:block;font:700 1.5rem/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.zahlen span{display:block;font-size:.75rem;color:var(--sec);margin-top:4px;line-height:1.25}
.fach{padding:14px 16px 16px}
.fk{display:flex;align-items:center;gap:12px}
.fk .ic{font-size:1.5rem;line-height:1}
.fk .na{flex:1;font:600 1.125rem/1.2 var(--sans);color:var(--label);text-decoration:none}
.pips{display:flex;gap:5px}.pips b{width:10px;height:10px;border-radius:50%;background:var(--fill)}
.bal{display:grid;grid-template-columns:6.5rem 1fr 2.6rem;gap:10px;align-items:center;margin-top:11px;font-size:.875rem;color:var(--sec)}

.bal .bar.gr i{background:var(--ok)}

.stolper{margin-top:12px;font-size:.875rem;color:var(--sec);line-height:1.9}

.stolper a.ok{color:var(--ok);background:var(--okbg)}
.liste{padding:2px 16px}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--sep)}
.li:first-child{border-top:0}
.li .em{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:1.375rem;line-height:1}
.li .t{flex:1;min-width:0}
.li .na{font:600 1.0625rem/1.25 var(--sans);color:var(--label)}
.li .dt{font-size:.8125rem;color:var(--ter)}
.li .zz{text-align:right;font:600 1.0625rem/1.25 var(--sans);color:var(--sec);font-variant-numeric:tabular-nums;white-space:nowrap}
.li .zz small{display:inline;font:400 1.0625rem/1.25 var(--sans);color:var(--sec);margin-left:.3em;letter-spacing:0}
textarea{width:100%;height:5.5rem;font:.8125rem/1.4 var(--mono);color:var(--label);background:var(--fill);border:2px solid transparent;border-radius:12px;padding:10px;resize:vertical;word-break:break-all}
details summary{cursor:pointer;font-size:1.0625rem;min-height:32px}

.mel{font-size:.9375rem;margin-top:8px;min-height:1em}
label.tg{display:flex;align-items:center;gap:10px;font-size:.9375rem;margin-top:12px;color:var(--sec);min-height:36px}
label.tg input{width:20px;height:20px;accent-color:var(--tint)}

#stats{text-align:center;padding:14px 16px}
#stats .zahlen{margin-top:0;border-top:0}
#stats .zahlen div{padding-top:0}
.content{padding-top:16px}
button,summary,details,label,select,input,a{font-family:var(--sans)}
input[type=text],textarea{font-family:var(--mono)}
details summary{font:500 1.0625rem/1.3 var(--sans);list-style-position:inside}
.rang{display:flex;justify-content:flex-start;align-items:center;gap:14px;text-align:left;padding:16px}
.rang .rem{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:color-mix(in srgb,var(--reward) 16%,var(--card));display:flex;align-items:center;justify-content:center;font-size:1.625rem;line-height:1}
.rang .rl{color:var(--sec);font-size:.8125rem}
.rang .rn{font:700 1.375rem/1.2 var(--disp);letter-spacing:-.01em}
.bar u{left:80%}

.kopf{margin:4px 2px 16px}
.kopf h1{font:700 2.125rem/1.12 var(--disp);letter-spacing:-.02em;margin:0 0 4px}
.kopf p{margin:0;font-size:.9375rem;color:var(--sec)}
.card p{margin:0 0 10px;color:var(--label);font-size:1.0625rem;line-height:1.5}.card p:last-child{margin:0}
.card h2{margin:18px 0 6px;font:600 1.0625rem/1.3 var(--sans)}.card h2:first-child{margin-top:0}
.card ul{margin:0 0 10px;padding-left:20px;line-height:1.5}.card li{margin-bottom:4px}
.btn.voll{display:block;width:100%;margin-top:12px}
.stat{margin-top:12px;font-size:.9375rem;line-height:1.5;min-height:1.5em;text-align:center;color:var(--sec)}
.stat:empty{display:none}.stat.ok{color:var(--ok)}.stat.no{color:var(--warn)}
.cam{position:relative;margin-top:12px;border-radius:12px;overflow:hidden;background:#000;display:none;aspect-ratio:1/1}

.cam .rahmen{position:absolute;inset:18%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.fuss{margin-top:16px;font-size:.8125rem;color:var(--sec);text-align:center;line-height:1.7}.fuss a{color:var(--sec)}
.zeile{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--label);min-height:44px;font-size:1.0625rem}
.zeile+.zeile{border-top:1px solid var(--sep)}.zeile span{color:var(--ter)}
.zur{display:inline-block;margin-bottom:12px;font-size:.9375rem}</style>

<body>
<main class="win"><div class="content">
  <div class="kopf"><h1>QR-Scanner</h1><p>Hilfe, Kontrolle und Abzeichen öffnen</p></div>
  <div class="card">
    <p>Halte die Kamera auf einen QR-Code deines Arbeitsblatts. Die passende Seite öffnet sich von selbst.</p>
    <p>Das Kamerabild bleibt auf deinem Handy und wird nicht gesendet.</p>
  </div>
  <div class="cam" id="cam"><video id="v" playsinline muted></video><div class="rahmen"></div></div>
  <button type="button" class="btn voll" id="start">Kamera starten</button>
  <button type="button" class="btn sec voll" id="stop" style="display:none">Kamera stoppen</button>
  <div class="stat" id="msg" role="status" aria-live="polite"></div>
  <p class="fuss"><a href="../">Startseite</a> · <a href="../datenschutz.html">Datenschutz</a></p>
</div></main><script src="jsQR.js"></script>
<script>
(function(){
  'use strict';
  var v=document.getElementById('v'), cam=document.getElementById('cam'), msg=document.getElementById('msg');
  var bStart=document.getElementById('start'), bStop=document.getElementById('stop');
  var cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  var stream=null, laeuft=false, fertig=false;
  // Erlaubte Ziele: nur Seiten von technixedu.de (und die alte Adresse), nie fremde Links.
  var OK=/^https:\/\/(technixedu\.de|technixedu\.github\.io\/lernsystem)\/[A-Za-z0-9._\/?=&%-]*$/;
  function say(t,c){msg.textContent=t; msg.className='stat'+(c?' '+c:'')}
  function pruefe(daten){
    if(!OK.test(daten)){ say('Das ist kein TechnixEdu-Code. Es wird nichts geöffnet.','no'); return false }
    fertig=true; stoppen(); say('Gefunden. Die Seite öffnet sich …','ok');
    setTimeout(function(){location.href=daten},400); return true;
  }
  function decodeData(img,w,h){var r=window.jsQR(img,w,h,{inversionAttempts:'attemptBoth'}); return r&&r.data}
  function schleife(){
    if(!laeuft) return;
    if(v.readyState>=2&&v.videoWidth){
      var s=Math.min(1,640/v.videoWidth); cv.width=Math.round(v.videoWidth*s); cv.height=Math.round(v.videoHeight*s);
      cx.drawImage(v,0,0,cv.width,cv.height);
      var d=cx.getImageData(0,0,cv.width,cv.height), code=decodeData(d.data,cv.width,cv.height);
      if(code&&pruefe(code)) return;
    }
    setTimeout(function(){requestAnimationFrame(schleife)},90);
  }
  function stoppen(){
    laeuft=false; if(stream){stream.getTracks().forEach(function(t){t.stop()}); stream=null}
    v.srcObject=null; cam.style.display='none'; bStop.style.display='none'; bStart.style.display='block';
  }
  function starten(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Dieser Browser kann die Kamera nicht öffnen. Nutze die Kamera-App deines Handys und scanne den Code dort.','no'); return}
    say('Kamera wird gestartet …');
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
      stream=s; v.srcObject=s; return v.play();
    }).then(function(){
      cam.style.display='block'; bStart.style.display='none'; bStop.style.display='block'; say('Halte den QR-Code in den Rahmen.'); laeuft=true; fertig=false; schleife();
    }).catch(function(e){
      stoppen();
      say((e&&e.name==='NotAllowedError')?'Der Kamerazugriff wurde nicht erlaubt. Erlaube ihn in den Browser-Einstellungen oder scanne mit der Kamera-App.':'Die Kamera konnte nicht gestartet werden. Scanne den Code mit der Kamera-App deines Handys.','no');
    });
  }
  bStart.addEventListener('click',starten); bStop.addEventListener('click',function(){stoppen(); say('')});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&laeuft) {stoppen(); say('Kamera angehalten.')}});
  if(/[?&]start=1/.test(location.search)) starten();   // Link von der Startseite: Kamera sofort starten
  // nur zum Testen
  window.__scan={pruefe:pruefe,decode:function(data,w,h){return decodeData(data,w,h)},ok:function(u){return OK.test(u)}};
})();
</script>
